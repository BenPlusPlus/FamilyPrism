name: Release Windows client

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump for prismclient/Directory.Build.props
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: client-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RAILWAY_SERVICE: FamilyPrism
    steps:
      - name: Require master
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw "Client releases must run from master (got $($env:GITHUB_REF)). Re-run the workflow on master."
          }

      - name: Check secrets
        shell: pwsh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLIENT_RELEASE_GITHUB_TOKEN: ${{ secrets.CLIENT_RELEASE_GITHUB_TOKEN }}
        run: |
          if (-not $env:RAILWAY_TOKEN) {
            throw 'Repository secret RAILWAY_TOKEN is missing. Add a Railway project token for production.'
          }
          if (-not $env:CLIENT_RELEASE_GITHUB_TOKEN) {
            throw 'Repository secret CLIENT_RELEASE_GITHUB_TOKEN is missing. Add a fine-grained PAT with Contents and Pull requests read/write on this repo.'
          }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: master
          token: ${{ secrets.CLIENT_RELEASE_GITHUB_TOKEN }}

      - name: Bump client version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git fetch --tags --force origin
          if ($LASTEXITCODE -ne 0) {
            throw "git fetch --tags failed with exit $LASTEXITCODE."
          }
          pwsh -NoProfile -File prismclient/bump-client-version.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "bump-client-version self-test failed with exit $LASTEXITCODE."
          }
          pwsh -NoProfile -File prismclient/bump-client-version.ps1 -Bump '${{ inputs.bump }}'
          if ($LASTEXITCODE -ne 0) {
            throw "bump-client-version failed with exit $LASTEXITCODE."
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        shell: pwsh
        run: |
          dotnet test prismclient/prismshared.tests/prismshared.tests.csproj -c Release --nologo

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Publish zip and installer
        shell: pwsh
        run: pwsh -NoProfile -File prismclient/publish-client.ps1

      - name: Land version via PR, then tag
        id: artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.CLIENT_RELEASE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:VERSION
          if (-not $version) {
            throw 'Version output from the bump step was empty.'
          }
          $tag = "v$version"
          $branch = "release/client-$version"
          git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists."
          }

          $zip = "prismclient/artifacts/FamilyPrism-$version-win-x64.zip"
          $setup = "prismclient/artifacts/installer/FamilyPrismSetup-$version.exe"
          foreach ($path in @($zip, $setup)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing artifact '$path'."
            }
          }

          $sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/FamilyPrism-$version-win-x64.zip"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- prismclient/Directory.Build.props prismclient/installer/FamilyPrism.iss
          git commit -m "Release Windows client $version"
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with exit $LASTEXITCODE."
          }

          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) {
            throw "git push $branch failed with exit $LASTEXITCODE."
          }

          $prNumber = gh pr list --head $branch --base master --state open --json number --jq '.[0].number'
          if (-not $prNumber) {
            $body = "Automated Windows client $version version bump from the Release Windows client workflow.`n`nThe zip and installer are already built on the runner. This PR lands Directory.Build.props and FamilyPrism.iss so master can pass prism-api, then the workflow tags $tag."
            gh pr create --base master --head $branch --title "Release Windows client $version" --body $body
            if ($LASTEXITCODE -ne 0) {
              throw "gh pr create failed with exit $LASTEXITCODE."
            }
            $prNumber = gh pr list --head $branch --base master --state open --json number --jq '.[0].number'
          }
          if (-not $prNumber) {
            throw "Could not create or find the version PR for $branch."
          }
          Write-Host "Version PR is https://github.com/$($env:GITHUB_REPOSITORY)/pull/$prNumber"

          $deadline = [datetime]::UtcNow.AddMinutes(20)
          $mergedSha = $null
          while ($true) {
            $pr = gh pr view $prNumber --json state,mergeable,mergeStateStatus,statusCheckRollup,mergeCommit | ConvertFrom-Json
            if ($pr.state -eq 'MERGED') {
              $mergedSha = $pr.mergeCommit.oid
              break
            }
            if ($pr.state -eq 'CLOSED') {
              throw "Version PR #$prNumber was closed without merging."
            }

            $checks = @($pr.statusCheckRollup)
            $failed = @(
              $checks | Where-Object {
                $_.conclusion -in @('FAILURE', 'CANCELLED', 'TIMED_OUT', 'ACTION_REQUIRED')
              }
            )
            if ($failed.Count -gt 0) {
              $names = ($failed | ForEach-Object { $_.name }) -join ', '
              throw "Version PR #$prNumber checks failed: $names"
            }

            if ($pr.mergeStateStatus -eq 'BEHIND') {
              gh api --method PUT "repos/$($env:GITHUB_REPOSITORY)/pulls/$prNumber/update-branch"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "update-branch returned $LASTEXITCODE"
              }
            }
            elseif ($pr.mergeStateStatus -eq 'DIRTY') {
              throw "Version PR #$prNumber has merge conflicts with master."
            }
            else {
              $prism = @(
                $checks | Where-Object { $_.name -eq 'prism-api' -and $_.conclusion -eq 'SUCCESS' }
              )
              if ($prism.Count -gt 0 -and $pr.mergeStateStatus -in @('CLEAN', 'HAS_HOOKS', 'UNSTABLE')) {
                gh pr merge $prNumber --squash --delete-branch --subject "Release Windows client $version"
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "gh pr merge returned $LASTEXITCODE; will retry until deadline."
                }
              }
            }

            if ([datetime]::UtcNow -gt $deadline) {
              throw "Timed out waiting for version PR #$prNumber to pass prism-api and merge."
            }
            Start-Sleep -Seconds 10
          }

          if (-not $mergedSha) {
            $mergedSha = gh pr view $prNumber --json mergeCommit --jq .mergeCommit.oid
          }
          if (-not $mergedSha) {
            throw "Version PR #$prNumber merged but merge commit SHA was empty."
          }

          git fetch origin master
          if ($LASTEXITCODE -ne 0) {
            throw "git fetch origin master failed with exit $LASTEXITCODE."
          }
          git tag $tag $mergedSha
          if ($LASTEXITCODE -ne 0) {
            throw "git tag $tag $mergedSha failed with exit $LASTEXITCODE."
          }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) {
            throw "git push tag $tag failed with exit $LASTEXITCODE."
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$sha256"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "url=$url"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.artifacts.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $zip = "prismclient/artifacts/FamilyPrism-$($env:VERSION)-win-x64.zip"
          $setup = "prismclient/artifacts/installer/FamilyPrismSetup-$($env:VERSION).exe"
          gh release create $env:TAG $zip $setup `
            --title "Windows client $($env:VERSION)" `
            --generate-notes `
            --verify-tag

      - name: Install Railway CLI
        shell: pwsh
        run: npm install -g @railway/cli

      - name: Pin package on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.artifacts.outputs.url }}
          SHA256: ${{ steps.artifacts.outputs.sha256 }}
        shell: pwsh
        run: |
          railway variable set `
            "CLIENT_PACKAGE_VERSION=$env:VERSION" `
            "CLIENT_PACKAGE_URL=$env:URL" `
            "CLIENT_PACKAGE_SHA256=$env:SHA256" `
            --service $env:RAILWAY_SERVICE
