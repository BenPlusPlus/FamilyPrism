name: prism-api

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: prism-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prism-api:
    name: prism-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prism-api
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: prism-api/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: prism-api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
